name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload production env when provided
        if: env.ENV_PRODUCTION != ''
        run: |
          printf '%s' "$ENV_PRODUCTION" > .env.production
          scp .env.production "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/.env.production"

      - name: Download category model release (있으면)
        id: model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p model_artifact
          if gh release download \
            --repo PREP-capstone/PREP-AI \
            --pattern "best_healthcare_model_onnx.zip" \
            --dir model_artifact; then
            unzip -o model_artifact/best_healthcare_model_onnx.zip -d model_artifact
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PREP-AI에 아직 카테고리 모델 release가 없습니다 — 모델 배포를 건너뜁니다."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload category model to EC2
        if: steps.model.outputs.found == 'true'
        run: |
          ssh "$EC2_USER@$EC2_HOST" "mkdir -p '$EC2_APP_DIR/data/models'"
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            model_artifact/category_classifier_onnx/ \
            "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/data/models/category_classifier_onnx/"

      - name: Deploy application
        run: |
          ssh "$EC2_USER@$EC2_HOST" "
            set -e
            cd '$EC2_APP_DIR'
            git fetch origin main
            git reset --hard origin/main
            docker compose -p prep-be -f compose.prod.yml down --remove-orphans || true
            docker ps -aq --filter 'name=prep-api' --filter 'name=prep-redis' | xargs -r docker rm -f
            docker compose -p prep-be -f compose.prod.yml up -d --build --remove-orphans
            docker compose -p prep-be -f compose.prod.yml exec -T api alembic upgrade head
            docker compose -p prep-be -f compose.prod.yml exec -T api python scripts/seed_standard_scales.py
            docker compose -p prep-be -f compose.prod.yml exec -T api python scripts/check_deploy_ready.py --skip-chroma
            curl -fsS http://127.0.0.1:8000/api/v1/health
          "
