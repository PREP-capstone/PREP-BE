name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
      AI_MODEL_ARCHIVE: best_healthcare_model_onnx.zip
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Download category classifier model
        run: |
          mkdir -p model-artifact
          gh release download \
            --repo PREP-capstone/PREP-AI \
            --pattern "$AI_MODEL_ARCHIVE" \
            --dir model-artifact \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.AI_REPO_TOKEN }}

      - name: Upload category classifier model
        run: |
          scp "model-artifact/$AI_MODEL_ARCHIVE" "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/$AI_MODEL_ARCHIVE"

      - name: Upload production env when provided
        if: env.ENV_PRODUCTION != ''
        run: |
          printf '%s' "$ENV_PRODUCTION" > .env.production
          scp .env.production "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/.env.production"

      - name: Deploy application
        run: |
          ssh "$EC2_USER@$EC2_HOST" "
            set -e
            cd '$EC2_APP_DIR'
            git fetch origin main
            git reset --hard origin/main
            sudo mkdir -p data/models
            sudo rm -rf data/models/category_classifier_onnx
            sudo python3 scripts/extract_model_archive.py '$AI_MODEL_ARCHIVE' --target-dir data/models
            sudo chown -R \$USER:\$USER data/models
            chmod -R a+rX data/models/category_classifier_onnx
            docker compose -p prep-be -f compose.prod.yml down --remove-orphans || true
            docker ps -aq --filter 'name=prep-api' --filter 'name=prep-redis' | xargs -r docker rm -f
            docker compose -p prep-be -f compose.prod.yml up -d --build --remove-orphans
            docker compose -p prep-be -f compose.prod.yml exec -T api alembic upgrade head
            docker compose -p prep-be -f compose.prod.yml exec -T api python scripts/seed_standard_scales.py
            docker compose -p prep-be -f compose.prod.yml exec -T api python scripts/check_deploy_ready.py --skip-chroma
            curl -fsS http://127.0.0.1:8000/api/v1/health
            curl -fsS -X POST http://127.0.0.1:8000/api/v1/category-classifier/predict \
              -H 'Content-Type: application/json' \
              -d '{\"service_description\":\"사용자의 혈당 수치를 기록하고 변화 추이를 보여주는 건강관리 앱\"}'
          "
