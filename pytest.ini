[pytest]
testpaths = tests
asyncio_mode = auto
# app/db/session.py의 엔진은 모듈 전역이라 커넥션 풀이 이벤트 루프에 묶인다.
# 테스트마다 루프를 새로 만들면 이전 루프에 묶인 커넥션을 정리하다 "Event loop is closed"가 난다.
# 전 테스트가 한 루프를 공유하도록 세션 스코프로 고정한다.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    db: 로컬 PostgreSQL(compose.yml)이 떠 있어야 실행되는 테스트. 제외하려면 -m "not db"
    ml_model: data/models/(카테고리 분류 체크포인트, git 미포함)이 로컬에 있어야 실행되는 테스트. 제외하려면 -m "not ml_model"
