services:
  postgres:
    image: postgres:16-alpine
    container_name: prep-postgres
    environment:
      POSTGRES_DB: prep
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep_local
    ports:
      - "5433:5432"
    volumes:
      - prep_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prep -d prep"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prep-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prep_postgres_data: